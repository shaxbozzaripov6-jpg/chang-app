<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Chang Monitor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/static/app.css?v=9">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="city-pill" id="cityBtn" type="button">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="cityName">…</span>
        <svg viewBox="0 0 24 24" class="ico chev"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="refresh">
        <svg viewBox="0 0 24 24" class="ico"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>

    <main>
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-forecast"></section>
      <section class="view" id="view-map">
        <div class="seg map-seg" id="mapSeg">
          <button type="button" data-mode="cities" class="on" data-i18n="mapCities"></button>
          <button type="button" data-mode="cloud" data-i18n="mapCloud"></button>
          <button type="button" data-mode="sensors" data-i18n="mapSensors" hidden></button>
        </div>
        <div class="map-wrap">
          <div id="map"></div>
          <div class="map-legend" id="mapLegend"></div>
          <div class="timeline" id="timeline" hidden>
            <button type="button" class="play-btn" id="playBtn" aria-label="play">▶</button>
            <input type="range" id="timeSlider" min="0" max="0" value="0">
            <span class="time-label" id="timeLabel"></span>
          </div>
        </div>
      </section>
      <section class="view" id="view-stats"></section>
      <section class="view" id="view-settings"></section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="home" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><span data-i18n="tabHome"></span>
      </button>
      <button class="tab" data-view="forecast" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8v4h2V3h-8v2h4l-6 6-4-4-8 8z"/></svg><span data-i18n="tabForecast"></span>
      </button>
      <button class="tab" data-view="map" type="button">
        <svg viewBox="0 0 24 24"><path d="M15 5l-6-2-6 2v16l6-2 6 2 6-2V3zM9 5.2l6 2v11.6l-6-2z"/></svg><span data-i18n="tabMap"></span>
      </button>
      <button class="tab" data-view="stats" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 20h16v-2H4zm1-4h3V9H5zm5 0h3V4h-3zm5 0h3v-5h-3z"/></svg><span data-i18n="tabStats"></span>
      </button>
      <button class="tab" data-view="settings" type="button">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span data-i18n="tabSettings"></span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="citySheet" role="dialog">
    <div class="sheet-handle"></div>
    <h3 data-i18n="chooseCity"></h3>
    <button class="loc-btn" id="locBtn" type="button" data-i18n="useLocation"></button>
    <div class="city-list" id="cityList"></div>
  </div>
  <div class="sheet" id="reportSheet" role="dialog">
    <div class="sheet-handle"></div>
    <h3 data-i18n="reportTitle"></h3>
    <p class="muted small" data-i18n="reportHint"></p>
    <label class="photo-pick" id="photoPick">
      <input type="file" id="photoInput" accept="image/*" hidden>
      <img id="photoPreview" alt="" hidden>
      <span id="photoPickText" data-i18n="choosePhoto"></span>
    </label>
    <textarea id="captionInput" rows="2" maxlength="300"></textarea>
    <p class="muted small" id="reportPlace"></p>
    <button class="primary-btn" id="sendReportBtn" type="button" data-i18n="send" disabled></button>
  </div>
  <div class="sheet" id="daySheet" role="dialog">
    <div class="sheet-handle"></div>
    <div id="dayContent"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/static/i18n.js?v=9"></script>
  <script src="/static/app.js?v=9"></script>
</body>
</html>
